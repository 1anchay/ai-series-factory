name: Build free cinematic episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Choose an existing episode
        required: true
        default: '001'
        type: choice
        options: ['001']
      voice:
        description: Generate Russian narration
        default: 'true'
        type: choice
        options: ['true', 'false']
      narrator:
        description: Russian narrator voice
        default: 'irina'
        type: choice
        options: ['irina', 'dmitri', 'denis', 'ruslan']
      resolution:
        description: Video width, 9:16
        default: '720'
        type: choice
        options: ['360', '540', '720', '1080']
      fps:
        description: Frames per second
        default: '20'
        type: choice
        options: ['12', '18', '20', '24']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Cache downloaded voice model
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-russian-${{ inputs.narrator }}-medium-v1
      - name: Check Python sources
        run: python -m compileall -q scripts
      - name: Render cinematic episode
        env:
          EPISODE: ${{ inputs.episode }}
          VOICE: ${{ inputs.voice }}
          SERIES_NARRATOR: ${{ inputs.narrator }}
          RESOLUTION: ${{ inputs.resolution }}
          FPS: ${{ inputs.fps }}
        run: |
          if [ ! -f "episodes/${EPISODE}.json" ]; then
            echo "::error::Episode ${EPISODE} not found. Available episodes:"
            find episodes -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sort
            exit 1
          fi
          args=()
          if [ "$VOICE" = "false" ]; then args+=(--no-tts); fi
          python scripts/render.py \
            --episode "episodes/${EPISODE}.json" \
            --output "output/episode_${EPISODE}.mp4" \
            --resolution "$RESOLUTION" --fps "$FPS" "${args[@]}"
      - name: Validate exported video
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          ffprobe -v error -show_entries format=duration,size -of json "output/episode_${EPISODE}.mp4"
          test -s "output/episode_${EPISODE}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.episode }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
