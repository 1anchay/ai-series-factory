name: Build cinematic episode v0.7
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Available episode
        required: true
        default: '001'
        type: choice
        options: ['001']
      narrator:
        description: Russian voice (Edge Neural first, Piper fallback)
        default: 'irina'
        type: choice
        options: ['irina', 'dmitri']
      resolution:
        description: Width (9:16)
        default: '720'
        type: choice
        options: ['360', '540', '720', '1080']
      fps:
        description: Frames per second
        default: '20'
        type: choice
        options: ['12', '20', '24']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video & narration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m pip install 'edge-tts>=7,<9'
      - name: Cache fallback Russian narrator
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-russian-${{ inputs.narrator }}-medium-v1
      - name: Check Python sources
        run: python -m compileall -q scripts
      - name: Make full episode with compulsory voice
        env:
          EPISODE: ${{ inputs.episode }}
          SERIES_NARRATOR: ${{ inputs.narrator }}
          RESOLUTION: ${{ inputs.resolution }}
          FPS: ${{ inputs.fps }}
        run: |
          test -f "episodes/${EPISODE}.json" || (echo "::error::Episode not found"; exit 1)
          python scripts/director.py --episode "episodes/${EPISODE}.json" \
            --output "output/episode_${EPISODE}.mp4" \
            --resolution "$RESOLUTION" --fps "$FPS" --tts auto
      - name: Validate file with audio
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name -show_entries format=duration,size \
            -of json "output/episode_${EPISODE}.mp4" | tee output/validation.json
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 \
            "output/episode_${EPISODE}.mp4" | grep -q aac
          test -s "output/episode_${EPISODE}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: episode-${{ inputs.episode }}-with-voice
          path: |
            output/*.mp4
            output/validation.json
          if-no-files-found: error
          retention-days: 7
