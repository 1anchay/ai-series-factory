name: Offline Russian voice auditions — Silero 5.6
on:
  push:
    branches: [main]
    paths:
      - 'horror_audio_studio/silero_audition.py'
      - '.github/workflows/silero-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Torch CPU and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Synthesize three distinct Russian narrators
        run: python horror_audio_studio/silero_audition.py
      - name: Check all audio outputs
        run: |
          set -euo pipefail
          for p in horror_audio_studio/silero_auditions/*.mp3; do
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$p"
          done
          test "$(find horror_audio_studio/silero_auditions -maxdepth 1 -name '*.mp3' | wc -l)" = 3
      - uses: actions/upload-artifact@v4
        with:
          name: natural-russian-silero-samples
          path: horror_audio_studio/silero_auditions/*
          retention-days: 14
          if-no-files-found: error
