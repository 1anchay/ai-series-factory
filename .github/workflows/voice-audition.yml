name: Voice casting - natural Russian narration
on:
  push:
    branches: [main]
    paths:
      - 'horror_audio_studio/voice_audition.py'
      - '.github/workflows/voice-audition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and repaired Edge TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade --no-cache-dir 'edge-tts==7.3.1'
          python -m pip show edge-tts
      - name: Make strict voice samples (no robotic fallback)
        run: python horror_audio_studio/voice_audition.py
      - name: Validate generated voices
        run: |
          set -euo pipefail
          for p in horror_audio_studio/auditions/0*.mp3; do
            test -s "$p"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$p"
          done
          test "$(find horror_audio_studio/auditions -maxdepth 1 -name '*.mp3' | wc -l)" = 3
      - uses: actions/upload-artifact@v4
        with:
          name: russian-voice-auditions
          path: horror_audio_studio/auditions/*
          retention-days: 14
          if-no-files-found: error
